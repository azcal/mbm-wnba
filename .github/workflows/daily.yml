name: mbm-wnba-daily
on:
  schedule:
    - cron: "0 15 * 3-10 *"       # 9:00am MDT
    - cron: "0 16 * 1-2,11-12 *"  # 9:00am MST
    - cron: "0 22 * 3-10 *"       # 4:00pm MDT
    - cron: "0 23 * 1-2,11-12 *"  # 4:00pm MST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python daily_wnba.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: commit logs
        run: |
          mkdir -p logs && date > logs/last_run.txt
          git config user.name mbm-bot && git config user.email bot@mbm
          git add logs/ && git diff --cached --quiet || git commit -m "board $(date +%F)"
          git push
