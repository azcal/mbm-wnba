name: mbm-wnba-daily
# 9am Mountain for the full board, 4pm for changes only. Two cron lines per target because
# GitHub Actions runs on UTC and ignores daylight saving; without the split a board set for
# 4pm fires at 3pm for the whole season it is played in.
on:
  schedule:
    # Hourly tick. slot_gate.py decides whether a tick is a board run: GitHub starts
    # scheduled jobs hours late, so a fixed cron time cannot be trusted. See slot_gate.py.
    # Board times (Mountain time, daylight saving handled by the gate): am=09:00,pm=16:00
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_push:
        description: "Post the full board even if nothing repriced since the last run"
        type: boolean
        default: true
permissions:
  contents: write
# One run at a time. A second tick waits, then its gate sees the first one's marker.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      name: ${{ steps.g.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            slot_gate.py
            logs/last_slot.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 slot_gate.py
        env:
          SLOTS: "am=09:00,pm=16:00"
          SLOT_MARKER: "logs/last_slot.txt"
          SLOT_EVENT: ${{ github.event_name }}
          SLOT_SEASON: "05-01..11-05"
  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      # Import-only check: fails in seconds on a missing file or a syntax error, rather than
      # after the data pull.
      - run: python -c "import daily_wnba"
      - run: python daily_wnba.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # The quotes matter. "@" starts a reserved indicator in YAML, so a bare
          # @everyone here is a parse error and GitHub hides the whole workflow.
          DISCORD_MENTION: "@everyone"
          # Manual runs post the whole board. Scheduled runs do not, so the 9am cron is
          # the first-of-day full push and the 4pm cron sends only what repriced.
          #
          # The chain short-circuits on the event name, so a scheduled run never reads the
          # inputs context at all. False yields an empty string, and tg_delta only treats
          # "1", "true" or "yes" as set, so an empty value is the same as unset.
          FORCE_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_push && '1' || '' }}

      # Two things the original commit step got wrong.
      #
      # It failed outright when the remote had moved since checkout, which happens whenever
      # a deploy overlaps a scheduled run. This version keeps a copy of what the run
      # produced, resets onto the remote, restores the copy and retries.
      #
      # It also failed when a path was in .gitignore, because `git add` returns non-zero on
      # an ignored path and `set -e` killed the step. This repo ignores data/, so the
      # wehoop parquets are re-fetched every run and only logs/ is tracked. logs/ is the
      # part that matters: predictions.csv and push_cache.json live there, and without them
      # every run would push the full board as if it were the first of the day.
      - name: commit state
        env:
          SLOT: ${{ needs.gate.outputs.slot }}
        run: |
          set -e
          mkdir -p logs && date > logs/last_run.txt
          # Record the slot so later ticks skip it. Written only here, so a failed run retries.
          if [ -n "$SLOT" ] && [ "$SLOT" != "manual" ]; then echo "$SLOT" > logs/last_slot.txt; fi
          git config user.name mbm-bot
          git config user.email bot@mbm
          TRACK=""
          for p in data logs; do
            [ -d "$p" ] || continue
            if git check-ignore -q "$p"; then
              echo "$p is gitignored, not committing it"
            else
              TRACK="$TRACK $p"
            fi
          done
          if [ -z "$TRACK" ]; then
            echo "nothing tracked to commit"
            exit 0
          fi
          TMP=$(mktemp -d)
          cp -r $TRACK "$TMP"/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git add $TRACK
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -q -m "$(basename $GITHUB_REPOSITORY) $(date +%F)"
            if git push -q; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "remote moved, re-basing this run's output onto it (attempt $i)"
            git fetch -q origin
            git reset -q --hard origin/${GITHUB_REF_NAME}
            for p in $TRACK; do cp -r "$TMP/$p" . 2>/dev/null || true; done
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
